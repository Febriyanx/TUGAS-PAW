<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Penghuni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Sistem Manajemen Kos — Modul Data Penghuni</h1>
</header>

<div class="container">
  <h2>Form Pendaftaran Penghuni</h2>

  <form>
    <label>Nomor KTP (NIK)</label>
    <input type="text" maxlength="16">

    <label>Nama Lengkap</label>
    <input type="text">

    <label>Jenis Kelamin</label>
    <input type="radio" name="jk" value="L"> Laki-laki
    <input type="radio" name="jk" value="P"> Perempuan

    <label>Tanggal Lahir</label>
    <input type="date">

    <label>Pekerjaan</label>
    <input type="text">

    <label>No. HP Penghuni</label>
    <input type="text">

    <label>Nama Kontak Darurat</label>
    <input type="text">

    <label>No. HP Kontak Darurat</label>
    <input type="text">

    <label>Alamat Asal</label>
    <textarea rows="3"></textarea>

    <label>Nomor Kamar</label>
    <input type="text" placeholder="Contoh: A-101">

    <label>Tanggal Mulai Sewa</label>
    <input type="date">

    <br>
    <button type="submit" class="btn">Simpan</button>
    <a href="index.html" class="btn btn-secondary">Batal</a>
  </form>
</div>

</body>
</html>
